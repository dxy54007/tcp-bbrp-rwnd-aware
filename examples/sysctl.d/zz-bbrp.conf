# Managed by tcp-bbrp install.sh
# Applied late in sysctl.d processing; keep the bbr fallback files intact.
# If tcp_bbrp fails to load after a kernel upgrade, this write fails and the
# earlier bbr setting (or the kernel default cubic) remains.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbrp
